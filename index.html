<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Particles</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id ="leftPanel">
            <div id="modePanel">
                <div class = title> Modes </div>
                <button data-mode="freeParticles">Free Particles</button>
                <button data-mode="particleLife">Particle Life</button>
                <button data-mode="boids">Boids</button>
                <button data-mode="reactionDiffusion">Reaction Diffusion</button>
                <button data-mode="fourier">Fourier</button>
            </div>
            <div id="freeParticlesInfoPanel">
                <div class = title> Commands </div>
                <p>Left click : attract</p>
                <p>Right click : repulse</p>
            </div>
            <div id="boidsInfoPanel">
                <div class = title> Commands </div>
                <p>Left click : create boids</p>
            </div>
            <div id="rulesPanelContainer">
                <div class = title> Rules </div>
                <div id="rulesPanel"></div>
            </div>
        </div>
            <canvas id="canvas"></canvas>
            <script type="module" src="./script/animate.js"></script>
    </body>
</html>
